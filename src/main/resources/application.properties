# Milkromug — локальный сервер печати чатов
server.port=8080
spring.application.name=milkromug

# Thymeleaf: без кэша для удобства разработки
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# По умолчанию Spring Boot ставит java.awt.headless=true, из-за чего
# GraphicsEnvironment.isHeadless() истинно и ветки Desktop пропускаются:
# браузер не открывается сам (BrowserAutoOpen), а POST /desktop-shortcut
# отдаёт ошибку headless. Включаем GUI-режим, чтобы Desktop.browse и
# создание .lnk-ярлыка работали на машине владельца.
spring.main.headless=false

# Промпт-17: HTTP 400 при захвате больших чатов (DeepSeek, Google AI).
# Увеличиваем лимиты POST-тела Tomcat и максимальную длину JSON-строки Jackson,
# чтобы длинные сообщения с кучей спецсимволов проходили без отказа сервера.
server.tomcat.max-http-form-post-size=10MB
server.max-http-request-header-size=64KB
# ВНИМАНИЕ: spring.jackson.parser.* принимает только флаги JsonParser.Feature
# (Map<Feature,Boolean>) — строка вида max-string-length туда не биндится и
# роняет контекст. Реальный лимит длинных строк (StreamReadConstraints,
# по умолчанию 20 МБ) поднимает customizer JacksonConfig до 10 000 000 символов.
milkromug.jackson.max-string-length=10000000
