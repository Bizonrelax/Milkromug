# Milkromug — локальный сервер печати чатов
server.port=8080
spring.application.name=milkromug

# Thymeleaf: без кэша для удобства разработки
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# По умолчанию Spring Boot ставит java.awt.headless=true, из-за чего
# GraphicsEnvironment.isHeadless() истинно и ветки Desktop пропускаются:
# браузер не открывается сам (BrowserAutoOpen), а POST /desktop-shortcut
# отдаёт ошибку headless. Включаем GUI-режим, чтобы Desktop.browse и
# создание .lnk-ярлыка работали на машине владельца.
spring.main.headless=false
