<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8"/>
    <title>Milkromug — печать чата</title>
    <link rel="stylesheet" th:href="@{/css/print.css}" href="/css/print.css"/>
    <!-- Спиннер шрифта интерфейса: применяем до отрисовки, без «прыжка» текста -->
    <script th:src="@{/js/ui-font.js}" src="/js/ui-font.js" defer></script>
</head>
<body>
<header class="toolbar no-print">
    <h1 class="brand">☕ Milkromug</h1>

    <!-- Спиннер №1: размер шрифта ПЕЧАТНОГО чата: 8..24 pt (?font=N) -->
    <label for="fontSpinner">Шрифт чата:</label>
    <input type="number" id="fontSpinner" name="fontSpinner"
           min="8" max="24" step="1"
           th:value="${fontSize}" value="12"/>
    <span class="hint">pt (8–24)</span>

    <!-- Спиннер №2: размер шрифта ИНТЕРФЕЙСА: 10..22 px, localStorage -->
    <label for="uiFontSpinner">Шрифт UI:</label>
    <input type="number" id="uiFontSpinner" name="uiFontSpinner"
           min="10" max="22" step="1" value="16"/>
    <span class="hint">px (10–22)</span>

    <button type="button" id="savePdfBtn" onclick="window.print()">
        💾 Сохранить в PDF
    </button>
</header>

<main id="chatPreview">
    <p class="placeholder">
        Отправьте JSON с чатом на <code>POST /chat</code>
        (например, через <code>curl</code>) — и здесь появится печатная версия диалога.
    </p>
    <pre class="sample no-print"><code>curl -X POST http://localhost:8080/chat \
  -H "Content-Type: application/json" \
  -d '{"title":"Демо","messages":[{"author":"user","text":"Привет!"}]}'</code></pre>
</main>

<script>
    // Спиннер №1: размер шрифта печатного чата (8–24 pt, ?font=N).
    // Спиннер №2 (#uiFontSpinner) — шрифт интерфейса — живёт в /js/ui-font.js
    // и полностью независим от этого кода.
    const spinner = document.getElementById('fontSpinner');
    const preview = document.getElementById('chatPreview');

    function applyFont() {
        let v = parseInt(spinner.value, 10);
        if (isNaN(v)) v = 12;
        v = Math.max(8, Math.min(24, v));
        preview.style.fontSize = v + 'pt';
        history.replaceState(null, '', '?font=' + v);
    }

    spinner.addEventListener('input', applyFont);
    applyFont();
</script>
</body>
</html>
